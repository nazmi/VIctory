name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rustfmt:
    # rustfmt does not compile code, so a Linux runner can check the
    # Windows-only crates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # `rust-toolchain.toml` pins the host triple (…-pc-windows-msvc), which
      # cannot run on this runner. Install the same release with this host's
      # triple instead, so the rustfmt version still matches local builds.
      - name: Install rustfmt
        run: |
          version="$(grep -oE '^channel = "[0-9]+\.[0-9]+\.[0-9]+' rust-toolchain.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$version" ]; then
            echo "no release version in rust-toolchain.toml"
            exit 1
          fi
          echo "using rustfmt from $version"
          rustup toolchain install "$version" --profile minimal --component rustfmt
          echo "RUSTFMT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the formatting
        run: cargo +"$RUSTFMT_VERSION" fmt --all -- --check
